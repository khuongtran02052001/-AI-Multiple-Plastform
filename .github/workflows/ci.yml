name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install ffmpeg if missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 180s apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check VPS shell script syntax
        run: |
          bash -n deploy/vps.sh
          bash -n deploy/remote-release.sh
      - name: Compile Python
        run: python -m compileall -q app tools
      - name: Check browser JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/ui-utils.js
          node tests/ui/ui-utils.test.cjs
      - name: Validate n8n workflow syntax
        run: node tools/check_workflows.mjs
      - name: Check installed dependencies
        run: python -m pip check
      - name: Verify browser-only Vercel preview
        run: |
          python tools/build_preview.py
          test -s public/index.html
          test -s public/static/app.js
