(()=>{'use strict';let used=7,billing='monthly',view='home',topNavState='home',animatePageOnRender=true,convert=true,method='card',publishing=false,progressTimer=null;const main=document.querySelector('#main'),modal=document.querySelector('#modal'),sheet=document.querySelector('#sheet'),toastBox=document.querySelector('#toast'),magicButton=document.querySelector('#magic-toggle'),magicMenu=document.querySelector('#magic-menu');const remaining=()=>Math.max(0,10-used);const featuresFree=['10 videos / month','720p HD resolution','Standard queue speed','1 channel per platform','Community support'];const featuresPro=['Unlimited videos & Shorts','Auto 9:16 conversion with blurred background','1080p Ultra HD quality','Instant priority rendering queue','Multi-account cross-posting','Unified cross-platform analytics'];const featuresAgency=['Everything in Pro','Unlimited brand workspaces','5 team member seats','API & webhooks for n8n / Make','24/7 VIP support'];function toast(text){toastBox.textContent=text;toastBox.hidden=false;clearTimeout(toastBox._timer);toastBox._timer=setTimeout(()=>toastBox.hidden=true,2600)}function updateQuota(){document.querySelector('#quota-head').textContent=`${remaining()}/10 Free left`;document.querySelector('.quota').setAttribute('aria-label',`${remaining()} of 10 free videos remaining`)}function closeMagicMenu(returnFocus=false){magicMenu.hidden=true;magicMenu.classList.remove('open');magicButton.setAttribute('aria-expanded','false');if(returnFocus)magicButton.focus()}function toggleMagicMenu(){if(!magicMenu.hidden){closeMagicMenu();return}magicMenu.hidden=false;magicButton.setAttribute('aria-expanded','true');requestAnimationFrame(()=>{magicMenu.classList.add('open');magicMenu.querySelector('[role="menuitem"]')?.focus();document.dispatchEvent(new Event('autopost:menuopen'))})}magicButton.addEventListener('click',toggleMagicMenu);magicMenu.addEventListener('keydown',e=>{const items=[...magicMenu.querySelectorAll('[role="menuitem"]')],index=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next]?.focus()}});document.addEventListener('focusin',e=>{if(!e.target.closest('.magic-wrap')&&!magicMenu.hidden)closeMagicMenu()});function glyph(type){return type==='youtube'?'▶':type==='tiktok'?'♪':type==='facebook'?'f':'◎'}function header(kicker,title,sub,action=''){return `<div class="page-head"><div><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function home(){const offset=264*(1-used/10);return `${header('THURSDAY, NOVEMBER 12','Good morning, Khuong.','Your next great post is one link away.',`<button class="button primary desktop-nav" data-view="ingest">＋ New post</button>`)}<div class="grid"><div class="stack"><section class="card quota-card"><div class="quota-layout"><div class="ring"><svg viewBox="0 0 100 100" role="img" aria-label="7 of 10 monthly videos used"><defs><linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d72ff"/><stop offset="1" stop-color="#18c6d2"/></linearGradient></defs><circle cx="50" cy="50" r="42"/><circle class="value" cx="50" cy="50" r="42" style="stroke-dashoffset:${offset}"/></svg><div class="ring-center"><b>${used}<small style="font-size:12px;color:#909caf">/10</small></b><small>VIDEOS USED</small></div></div><div class="quota-copy"><span class="tiny-badge">FREE PLAN</span><h2 style="margin-top:8px">Your monthly quota</h2><p>${remaining()} videos left on your free plan</p><span class="reset">↻ Resets in 18 days</span></div></div><div class="quota-foot"><p>Ready to create without limits?</p><button class="button primary" data-view="plans">⚡ Get unlimited</button></div></section>
<section class="card ingest-card" id="quick-ingest"><div class="card-head"><div><span class="eyebrow">QUICK PUBLISH</span><h2 style="margin-top:5px">Start with a video link</h2></div><span class="tiny-badge">01 / 03</span></div><div class="url-row"><input id="video-url" type="url" aria-label="Video URL" placeholder="Paste a TikTok, Reels or Shorts link"><button class="button ghost paste" id="paste">Paste link</button></div><div class="validation"><span class="valid-dot"></span><span>1024 × 576&nbsp; · &nbsp;145s&nbsp; · &nbsp;Landscape 16:9</span></div><div class="convert"><span><b>Auto-convert to vertical Shorts</b><small>Blurred background · 9:16 format</small></span><button class="switch" role="switch" aria-checked="true" aria-label="Auto-convert video format" id="convert"></button></div><div class="platforms"><button class="platform selected" aria-pressed="true"><span class="check">✓</span><span class="social-icon yt">▶</span>YouTube Shorts</button><button class="platform selected" aria-pressed="true"><span class="check">✓</span><span class="social-icon tt">♪</span>TikTok</button><button class="platform selected" aria-pressed="true"><span class="check">✓</span><span class="social-icon fb">f</span>Facebook Reels</button></div><div class="publish-row"><small>3 channels selected</small><button class="button primary" id="publish">Publish now&nbsp; →</button></div><div id="progress-area" hidden></div></section>

function planCard(name,tag,desc,price,features,kind,note=''){return `<article class="plan ${kind}">${kind==='pro'?'<span class="popular">✦ MOST POPULAR</span>':''}<span class="plan-tag">${tag}</span><h2>${name}</h2><p class="plan-desc">${desc}</p><div class="price"><strong>${price}</strong><span>/ month</span></div><div class="bill-note">${note}</div><button class="button ${kind==='pro'?'primary':'ghost'}" ${kind==='free'?'disabled':''} data-upgrade="${kind}">${kind==='free'?'Your active plan':kind==='agency'?'Get agency access':'Upgrade to Pro Creator'}</button><ul class="features">${features.map((f,i)=>`<li class="${kind==='pro'&&i<3?'featured':''}"><i>${i===0&&kind==='pro'?'✦':'✓'}</i><span>${f}</span></li>`).join('')}</ul></article>`}
function plans(){let pro=billing==='yearly'?'$15':'$19',agency=billing==='yearly'?'$39':'$49';return `<section class="pricing-head"><span class="eyebrow">A PLAN FOR YOUR NEXT CHAPTER</span><h1 class="gradient-text">Supercharge your<br class="mobile-only"> content creation</h1><p>Start free, upgrade when you’re ready to scale.</p><div class="billing" role="group" aria-label="Billing period"><button data-billing="monthly" class="${billing==='monthly'?'active':''}">Monthly</button><button data-billing="yearly" class="${billing==='yearly'?'active':''}">Yearly <em>· Save 20%</em></button></div></section><div class="plan-grid">${planCard('Starter','CURRENT ACTIVE TIER','A great place to get started.','$0',featuresFree,'free','Free forever')}${planCard('Pro Creator','BEST VALUE','For creators ready to grow their reach.',pro,featuresPro,'pro',billing==='yearly'?'Billed $180 annually · save $48':'Billed monthly')}${planCard('Agency / Studio','FOR POWER TEAMS','Bring every brand and collaborator together.',agency,featuresAgency,'agency',billing==='yearly'?'Billed $468 annually · save $120':'Billed monthly')}</div><button class="compare-toggle" id="compare">Compare all features&nbsp;⌄</button><div class="compare" id="compare-table"><table><thead><tr><th>Included</th><th>Starter</th><th>Pro Creator</th><th>Agency</th></tr></thead><tbody><tr><td>Monthly videos</td><td>10</td><td>Unlimited</td><td>Unlimited</td></tr><tr><td>Maximum resolution</td><td>720p</td><td>1080p</td><td>1080p</td></tr><tr><td>Auto vertical conversion</td><td>—</td><td>✓</td><td>✓</td></tr><tr><td>Connected channels</td><td>1 / platform</td><td>Unlimited</td><td>Unlimited</td></tr><tr><td>Team seats</td><td>1</td><td>1</td><td>5</td></tr><tr><td>API & webhooks</td><td>—</td><td>—</td><td>✓</td></tr></tbody></table></div><p class="feature-note">No charge in this interactive preview. Payment and publishing are simulated.</p>`}

const adminMetrics={registered:1420,pro:128,mrr:2432,limited:340,videos:6850};let adminFilter='all',adminSearch='',openUserMenu=null,upgradeUserId=null;const adminUsers=[{id:1,name:'Maya Chen',email:'maya.chen@email.com',plan:'Free Tier',used:4,bonus:0,renewal:'—',status:'Active'},{id:2,name:'Jamal Brooks',email:'jamal.brooks@email.com',plan:'Free Tier',used:10,bonus:0,renewal:'—',status:'Active'},{id:3,name:'Nina Patel',email:'nina.patel@northstar.co',plan:'Free Tier',used:7,bonus:0,renewal:'—',status:'Active'},{id:4,name:'Liam Carter',email:'liam@cartercreates.com',plan:'Pro Creator',used:3,bonus:0,renewal:'Dec 12, 2026',status:'Active',monthlyValue:19},{id:5,name:'Sofia Reyes',email:'sofia@reyesstudio.com',plan:'Free Tier',used:10,bonus:0,renewal:'—',status:'Active'},{id:6,name:'Amara Okafor',email:'amara@oakmedia.co',plan:'Pro Creator',used:6,bonus:0,renewal:'Jan 03, 2027',status:'Active',monthlyValue:19},{id:7,name:'Ethan Cole',email:'ethan.cole@email.com',plan:'Free Tier',used:8,bonus:0,renewal:'—',status:'Suspended'},{id:8,name:'Olivia Hart',email:'olivia@hartcreative.com',plan:'Free Tier',used:10,bonus:0,renewal:'—',status:'Active'},{id:9,name:'Theo Williams',email:'theo@williamshouse.tv',plan:'Pro Creator',used:1,bonus:0,renewal:'Feb 18, 2027',status:'Active',monthlyValue:19},{id:10,name:'Zoe Martin',email:'zoe.martin@email.com',plan:'Free Tier',used:10,bonus:0,renewal:'—',status:'Active'},{id:11,name:'Daniel Kim',email:'daniel@framebykim.com',plan:'Free Tier',used:2,bonus:0,renewal:'—',status:'Active'},{id:12,name:'Ava Dubois',email:'ava@adubois.studio',plan:'Pro Creator',used:9,bonus:0,renewal:'Mar 02, 2027',status:'Active',monthlyValue:19}];function isQuotaReached(user){return user.plan==='Free Tier'&&user.used>=10+user.bonus}function filteredAdminUsers(){const query=adminSearch.trim().toLowerCase();return adminUsers.filter(user=>{const matchesQuery=!query||user.name.toLowerCase().includes(query)||user.email.toLowerCase().includes(query);const matchesFilter=adminFilter==='all'||adminFilter==='free'&&user.plan==='Free Tier'||adminFilter==='pro'&&user.plan==='Pro Creator'||adminFilter==='quota'&&isQuotaReached(user);return matchesQuery&&matchesFilter})}function admin(){const count={all:adminMetrics.registered,free:adminMetrics.registered-adminMetrics.pro,pro:adminMetrics.pro,quota:adminMetrics.limited};const users=filteredAdminUsers();return `<section class="admin-page"><div class="admin-heading"><div><span class="eyebrow">AUTOPOST STUDIO · OPERATIONS</span><h1>Admin backoffice</h1><p>Manage creator plans, monthly quotas, and account access.</p></div><div class="mock-note">Demo backoffice · sample customer data only. Changes are temporary in this preview.</div></div><div class="admin-kpis"><article class="admin-kpi"><div class="admin-kpi-top"><span>Total registered users</span><span class="kpi-glyph">◉</span></div><strong>${adminMetrics.registered.toLocaleString()}</strong><small>Across all plans</small></article><article class="admin-kpi"><div class="admin-kpi-top"><span>Active Pro subscribers</span><span class="kpi-glyph">✦</span></div><strong>${adminMetrics.pro.toLocaleString()}</strong><small><span class="kpi-accent">$${Math.max(0,adminMetrics.mrr).toLocaleString()} MRR</span> · Pro Creator</small></article><article class="admin-kpi"><div class="admin-kpi-top"><span>At monthly quota limit</span><span class="kpi-glyph">⚡</span></div><strong>${adminMetrics.limited.toLocaleString()}</strong><small>Free users at 10/10 · potential buyers</small></article><article class="admin-kpi"><div class="admin-kpi-top"><span>Videos published this month</span><span class="kpi-glyph">▶</span></div><strong>${adminMetrics.videos.toLocaleString()}</strong><small>Across connected channels</small></article></div><section class="admin-users" aria-label="User management"><div class="admin-users-head"><div><h2>User management</h2><p>Search and manage customer subscriptions and quotas.</p></div></div><div class="admin-toolbar"><label class="admin-search-wrap"><span aria-hidden="true">⌕</span><input class="admin-search" id="admin-search" type="search" placeholder="Search name or email" aria-label="Search users by name or email" value="${adminSearch.replaceAll('&','&amp;').replaceAll('"','&quot;')}"></label></div><div class="admin-filters" role="group" aria-label="Filter users">${[['all','All Users'],['free','Free Tier'],['pro','Pro Subscribers'],['quota','10/10 Quota Reached']].map(([key,label])=>`<button class="admin-filter ${adminFilter===key?'active':''}" aria-pressed="${adminFilter===key}" data-admin-filter="${key}">${label}<span class="filter-count">${count[key].toLocaleString()}</span></button>`).join('')}</div><div class="table-scroll"><table class="user-table"><thead><tr><th scope="col">User info</th><th scope="col">Plan</th><th scope="col">Monthly usage</th><th scope="col">Renewal / expiry</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>${users.length?users.map(user=>{const limit=10+user.bonus,percent=Math.min(100,user.used/limit*100),reached=isQuotaReached(user);return `<tr class="user-row"><td><div class="user-info"><span class="user-avatar" aria-hidden="true">${user.name.split(' ').map(part=>part[0]).join('')}</span><span class="user-meta"><strong>${user.name}</strong><small>${user.email}</small></span></div></td><td><span class="plan-badge ${user.plan==='Pro Creator'?'plan-pro':'plan-free'}">${user.plan==='Pro Creator'?'✦ ':''}${user.plan}</span></td><td class="usage-cell"><div class="usage-label"><strong>${user.plan==='Pro Creator'?'Unlimited':`${user.used}/${limit}`}</strong>${reached?'<span class="limit-label">Limit reached</span>':''}</div>${user.plan==='Pro Creator'?'':`<div class="usage-track" role="progressbar" aria-label="Monthly quota used by ${user.name}" aria-valuemin="0" aria-valuemax="${limit}" aria-valuenow="${user.used}"><div class="usage-fill ${reached?'limit':''}" style="width:${percent}%"></div></div>`}</td><td class="date-cell">${user.renewal}</td><td><span class="row-status ${user.status==='Active'?'active':'suspended'}">${user.status}</span></td><td class="row-action-wrap"><button class="row-menu-trigger" type="button" aria-label="Actions for ${user.name}" aria-haspopup="menu" aria-expanded="${openUserMenu===user.id}" data-row-menu="${user.id}">···</button>${openUserMenu===user.id?`<div class="row-menu" role="menu"><button role="menuitem" data-row-action="upgrade" data-user="${user.id}">⭐ Upgrade to Pro (Manual override for bank transfer)</button><button role="menuitem" data-row-action="reset" data-user="${user.id}">🔄 Reset Monthly Quota to 0</button><button role="menuitem" data-row-action="bonus" data-user="${user.id}">🎁 Grant +10 Bonus Credits</button><button class="danger" role="menuitem" data-row-action="suspend" data-user="${user.id}">${user.status==='Suspended'?'✓ Reactivate Account':'🚫 Suspend Account'}</button></div>`:''}</td></tr>`}).join(''):'<tr><td class="admin-empty" colspan="6">No users match your search and filters.</td></tr>'}</tbody></table></div><div class="admin-footer"><span>Showing ${users.length} sample users · ${count[adminFilter].toLocaleString()} total in this segment</span><span>Monthly quota resets on the 1st</span></div></section></section>`}function render(){document.body.classList.toggle('admin-mode',view==='admin');updateQuota();document.querySelector('#admin-toggle').textContent=view==='admin'?'Exit Admin':'Admin View';document.querySelector('#admin-toggle').setAttribute('aria-pressed',String(view==='admin'));document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.view===view));document.querySelectorAll('.topnav-link').forEach(n=>n.classList.toggle('active',n.dataset.view===topNavState));main.innerHTML=`<section class="page">${view==='admin'?admin():view==='plans'?plans():view==='accounts'?accounts():view==='profile'?profile():home()}</section>`;if(view==='plans'){document.querySelectorAll('[data-billing]').forEach(b=>b.onclick=()=>{billing=b.dataset.billing;render()});document.querySelector('#compare').onclick=()=>{document.querySelector('#compare-table').classList.toggle('open');document.querySelector('#compare').textContent=document.querySelector('#compare-table').classList.contains('open')?'Hide feature comparison ⌃':'Compare all features ⌄'};document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{if(b.dataset.upgrade!=='free')openCheckout(b.dataset.upgrade)});}if(view==='home')wireIngest();if(animatePageOnRender){document.dispatchEvent(new Event('autopost:pageenter'));animatePageOnRender=false}}
function paywall(){sheet.innerHTML=`<div class="sheet-top"><span class="tiny-badge">⚡ FREE PLAN LIMIT</span><button class="close" aria-label="Close upgrade dialog">×</button></div><h2 id="modal-title">That’s a lot of content.</h2><p>You’ve used all 10 free videos this month. Go unlimited and keep your momentum going.</p><div class="checkout-price"><span><strong>Pro Creator</strong><small style="display:block;color:#a3afc1;font-size:9px">Unlimited posts · Cancel anytime</small></span><strong>$19<span style="font:400 10px var(--font);color:#929daf"> / month</span></strong></div><button class="button primary full" id="modal-upgrade">Upgrade to Pro Creator&nbsp; →</button><p class="secure-note">No real payment will be processed in this preview.</p>`;modal.classList.add('open');sheet.querySelector('.close').onclick=closeModal;sheet.querySelector('#modal-upgrade').onclick=()=>openCheckout('pro')}
function openCheckout(tier){const isAgency=tier==='agency';sheet.innerHTML=`<div class="sheet-top"><span class="tiny-badge">SECURE CHECKOUT PREVIEW</span><button class="close" aria-label="Close checkout">×</button></div><h2 id="modal-title">${isAgency?'Make room for your whole team':'Go unlimited with Pro'}</h2><p>One small step between you and a bigger content engine.</p><div class="checkout-price"><span><strong>${isAgency?'Agency / Studio':'Pro Creator'}</strong><small style="display:block;color:#a3afc1;font-size:9px">${billing==='yearly'?'Yearly billing · save 20%':'Monthly billing'}</small></span><strong>${isAgency?(billing==='yearly'?'$39':'$49'):(billing==='yearly'?'$15':'$19')}<span style="font:400 10px var(--font);color:#929daf"> / mo</span></strong></div><div class="paymethods" role="group" aria-label="Choose payment method"><button class="paymethod ${method==='card'?'active':''}" data-method="card"><span>▣</span>Card</button><button class="paymethod ${method==='apple'?'active':''}" data-method="apple"><span>●</span>Apple Pay</button><button class="paymethod ${method==='bank'?'active':''}" data-method="bank"><span>▦</span>Bank QR</button></div>${method==='card'?'<label class="field-label" for="card-name">Name on card</label><input class="field" id="card-name" autocomplete="cc-name" placeholder="Khuong Tran"><label class="field-label" for="card-number">Card number</label><input class="field" id="card-number" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242"><div class="field-row"><div><label class="field-label" for="expiry">Expiry</label><input class="field" id="expiry" autocomplete="cc-exp" placeholder="MM / YY"></div><div><label class="field-label" for="cvc">Security code</label><input class="field" id="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC"></div></div>':method==='apple'?'<div class="tip" style="margin:8px 0 15px"><span class="tip-mark">●</span><div><strong>Apple Pay</strong><p>Apple Pay checkout is available in the full product.</p></div></div>':'<div style="height:100px;display:grid;place-items:center;border:1px dashed #515c70;border-radius:12px;margin-bottom:15px;color:#aeb8c8;font-size:11px">Bank transfer QR preview</div>'}<button class="button primary full" id="pay">${method==='bank'?'Continue with bank transfer':'Subscribe securely'}&nbsp; →</button><p class="secure-note">Demo checkout only · no card data is sent or saved.</p>`;modal.classList.add('open');sheet.querySelector('.close').onclick=closeModal;sheet.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{method=b.dataset.method;openCheckout(tier)});sheet.querySelector('#pay').onclick=()=>{closeModal();toast('Checkout preview complete. No payment was processed.')};}
function closeModal(){modal.classList.remove('open')}function openUpgradeConfirmation(userId){const user=adminUsers.find(item=>item.id===userId);if(!user)return;upgradeUserId=userId;sheet.innerHTML=`<div class="sheet-top"><span class="tiny-badge">MANUAL SUBSCRIPTION OVERRIDE</span><button class="close" aria-label="Close upgrade confirmation">×</button></div><h2 class="upgrade-dialog-title" id="modal-title">Upgrade ${user.name} to Pro?</h2><p>This demo override updates the sample customer plan immediately after confirmation.</p><label class="duration-label" for="upgrade-duration">Subscription duration</label><select class="duration-select" id="upgrade-duration"><option value="month">1 Month</option><option value="year">1 Year</option><option value="lifetime">Lifetime</option></select><button class="button primary full confirm-upgrade" id="confirm-upgrade">Confirm Pro upgrade</button>`;modal.classList.add('open');sheet.querySelector('.close').onclick=closeModal;sheet.querySelector('#confirm-upgrade').onclick=()=>{const duration=sheet.querySelector('#upgrade-duration').value;const target=adminUsers.find(item=>item.id===upgradeUserId);if(!target)return;const wasFree=target.plan==='Free Tier',wasActivePro=target.plan==='Pro Creator'&&target.status==='Active';if(!wasActivePro)adminMetrics.pro++;if(isQuotaReached(target))adminMetrics.limited--;const monthlyValue=duration==='month'?19:duration==='year'?15:0;adminMetrics.mrr+=monthlyValue-(wasActivePro?(target.monthlyValue??19):0);target.monthlyValue=monthlyValue;target.plan='Pro Creator';const until=new Date();if(duration==='month')until.setMonth(until.getMonth()+1);else if(duration==='year')until.setFullYear(until.getFullYear()+1);target.renewal=duration==='lifetime'?'Lifetime':until.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});target.status='Active';closeModal();openUserMenu=null;toast(`Pro access granted to ${target.name}.`);render()};sheet.querySelector('#upgrade-duration').focus()}document.addEventListener('click',e=>{if(!e.target.closest('.magic-wrap')&&!magicMenu.hidden)closeMagicMenu();const adminToggle=e.target.closest('[data-admin-view]');if(adminToggle){view=view==='admin'?'home':'admin';topNavState='home';animatePageOnRender=true;openUserMenu=null;render();window.scrollTo({top:0,behavior:'smooth'});return}const filter=e.target.closest('[data-admin-filter]');if(filter){adminFilter=filter.dataset.adminFilter;openUserMenu=null;render();return}const menuButton=e.target.closest('[data-row-menu]');if(menuButton){const id=Number(menuButton.dataset.rowMenu);openUserMenu=openUserMenu===id?null:id;render();return}const rowAction=e.target.closest('[data-row-action]');if(rowAction){const user=adminUsers.find(item=>item.id===Number(rowAction.dataset.user));if(!user)return;const action=rowAction.dataset.rowAction;openUserMenu=null;if(action==='upgrade'){openUpgradeConfirmation(user.id);return}if(action==='reset'){if(isQuotaReached(user))adminMetrics.limited--;user.used=0;user.bonus=0;toast(`Monthly quota reset for ${user.name}.`)}if(action==='bonus'){if(isQuotaReached(user))adminMetrics.limited--;user.bonus+=10;toast(`10 bonus credits granted to ${user.name}.`)}if(action==='suspend'){const suspending=user.status==='Active';if(user.plan==='Pro Creator'){if(suspending){adminMetrics.pro--;adminMetrics.mrr-=user.monthlyValue??19}else{adminMetrics.pro++;adminMetrics.mrr+=user.monthlyValue??19}}user.status=suspending?'Suspended':'Active';toast(user.status==='Suspended'?`${user.name} suspended.`:`${user.name} reactivated.`)}render();return}if(view==='admin'&&!e.target.closest('.row-menu')){openUserMenu=null;document.querySelectorAll('.row-menu').forEach(menu=>menu.remove());document.querySelectorAll('.row-menu-trigger').forEach(button=>button.setAttribute('aria-expanded','false'))}});document.addEventListener('input',e=>{if(e.target.id==='admin-search'){adminSearch=e.target.value;const start=e.target.selectionStart;render();const input=document.querySelector('#admin-search');input.focus();input.setSelectionRange(start,start)}});function triggerPublish(){if(publishing)return;if(used>=10){paywall();return}publishing=true;const button=document.querySelector('#publish'),area=document.querySelector('#progress-area');button.disabled=true;area.hidden=false;area.innerHTML=`<div class="progress-card" style="margin-top:15px;padding:13px;border:1px solid #323b4c;background:#0c1320;border-radius:11px"><div style="display:flex;justify-content:space-between;font-size:10px"><strong id="progress-title">Downloading video</strong><span id="progress-pct">20%</span></div><div style="height:5px;border-radius:99px;background:#2a3342;margin-top:10px;overflow:hidden"><i id="progress-bar" style="display:block;height:100%;width:20%;background:linear-gradient(90deg,#986aff,#1abbd0);border-radius:99px;transition:width .55s"></i></div></div>`;const stages=[[20,'Downloading video'],[60,convert?'Converting to vertical 9:16':'Preparing video'],[85,'Uploading to 3 channels'],[100,'Published successfully']];let i=0;function next(){const [n,label]=stages[i];document.querySelector('#progress-title').textContent=label;document.querySelector('#progress-pct').textContent=n+'%';document.querySelector('#progress-bar').style.width=n+'%';if(i<stages.length-1){i++;progressTimer=setTimeout(next,820)}else{used++;updateQuota();publishing=false;button.disabled=false;toast('Your video is published across 3 channels.');setTimeout(()=>{const p=document.querySelector('#progress-area');if(p)p.hidden=true},2600)}}next()}
function wireIngest(){const publish=document.querySelector('#publish');if(publish)publish.onclick=triggerPublish;const sw=document.querySelector('#convert');if(sw)sw.onclick=()=>{convert=!convert;sw.setAttribute('aria-checked',String(convert))};document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{const selected=b.classList.toggle('selected');b.setAttribute('aria-pressed',String(selected));b.querySelector('.check').textContent=selected?'✓':'+';document.querySelector('.publish-row small').textContent=`${document.querySelectorAll('.platform.selected').length} channels selected`});document.querySelector('#paste').onclick=async()=>{try{const value=await navigator.clipboard.readText();if(value)document.querySelector('#video-url').value=value;else toast('Clipboard is empty. Paste a video link to continue.')}catch{document.querySelector('#video-url').focus();toast('Paste your video link into the field.')}}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-view]');if(target){const requestedView=target.dataset.view;if(target.closest('#magic-menu'))closeMagicMenu();view=requestedView;if(view==='ingest')view='home';topNavState=requestedView==='ingest'?'ingest':view;animatePageOnRender=true;render();if(requestedView==='ingest')setTimeout(()=>document.querySelector('#video-url')?.focus(),40);window.scrollTo({top:0,behavior:'smooth'})}const connect=e.target.closest('[data-connect]');if(connect)toast(connect.dataset.connect==='instagram'?'Instagram account reconnect is simulated in this preview.':'Channel settings are simulated in this preview.')});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(!magicMenu.hidden)closeMagicMenu(true)};if(e.key==='Tab'&&modal.classList.contains('open')){const items=[...sheet.querySelectorAll('button,input,select')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}});render();
