name: Publisher VPS — manual preflight / deploy

# Deliberately manual: do not automatically publish unreviewed code to the VPS.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight or redeploy only the Publisher service'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - deploy

permissions:
  contents: read

concurrency:
  group: publisher-vps-production
  cancel-in-progress: false

jobs:
  publisher-vps:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check deploy script syntax
        run: bash -n deploy/remote-release.sh
      - name: Validate authorized destination
        env:
          SSH_HOST: ${{ secrets.PUBLISHER_SSH_HOST }}
          SSH_USER: ${{ secrets.PUBLISHER_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PUBLISHER_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PUBLISHER_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.PUBLISHER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port >= 1 && port <= 65535 ))
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
      - name: Execute restricted Publisher operation over SSH
        env:
          SSH_HOST: ${{ secrets.PUBLISHER_SSH_HOST }}
          SSH_USER: ${{ secrets.PUBLISHER_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PUBLISHER_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PUBLISHER_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.PUBLISHER_SSH_PORT }}
          OPERATION: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$temp/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$temp/known_hosts"
          port="${SSH_PORT:-22}"
          test -s "$temp/deploy_key" && test -s "$temp/known_hosts"
          env -u SSH_PRIVATE_KEY -u SSH_KNOWN_HOSTS \
            ssh -p "$port" -i "$temp/deploy_key" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$temp/known_hosts" \
              -o IdentitiesOnly=yes \
              -o ConnectionAttempts=2 \
              -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "bash -s -- '$OPERATION' '$GITHUB_SHA'" < deploy/remote-release.sh
