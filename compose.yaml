services:
  publisher:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      # Production must not silently start with the SQLite example URL.
      REQUIRE_POSTGRES: "true"
    ports:
      - "127.0.0.1:${PUBLISHER_PORT:-8090}:8000"
    volumes:
      - publisher_data:/app/data
    tmpfs:
      - /tmp:size=320m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [https]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - publisher
volumes:
  publisher_data:
  caddy_data:
  caddy_config:
